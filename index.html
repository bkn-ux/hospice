<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>호스피스 백과사전</title>
<style>
:root{--ink:#111;--paper:#fbfaf6;--line:#d9d5c8}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Serif KR","Malgun Gothic",serif;line-height:1.8}
header{text-align:center;padding:56px 20px 24px}
header h1{font-size:2.2rem;margin:12px 0 4px;letter-spacing:.08em}
header p{margin:0;color:#555}
nav{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:10px 16px;z-index:5}
nav a{white-space:nowrap;color:var(--ink);text-decoration:none;font-size:.85rem;padding:4px 10px;border:1px solid var(--ink);border-radius:20px}
nav a:hover{background:var(--ink);color:var(--paper)}
main{max-width:860px;margin:0 auto;padding:0 20px 80px}
.era{padding-top:48px}
.era h2{font-size:1.5rem;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:4px}
.era .range{color:#666;font-size:.9rem}
.entry{display:grid;grid-template-columns:130px 1fr;gap:20px;padding:26px 0;border-bottom:1px dashed var(--line);opacity:0;transform:translateY(14px);transition:.7s}
.entry.in{opacity:1;transform:none}
.year{font-size:1.4rem;font-weight:700}
.entry h3{margin:0 0 6px;font-size:1.15rem}
.term{background:#f0eee5;border-left:3px solid var(--ink);padding:6px 10px;font-size:.9rem;margin-top:8px}
svg{width:120px;height:120px;fill:none;stroke:#111;stroke-width:.9;stroke-linecap:round;stroke-linejoin:round}
svg path{stroke-dasharray:var(--l);stroke-dashoffset:var(--l)}
.in svg path{animation:draw 2.6s ease forwards;animation-delay:calc(var(--i)*.18s)}
@keyframes draw{to{stroke-dashoffset:0}}
.hero svg{width:150px;height:150px}
@media(max-width:600px){.entry{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){svg path{stroke-dashoffset:0!important;animation:none!important}.entry{opacity:1;transform:none}}
</style></head><body>

<script>
const DATA=[{"era":"고대~중세","range":"~1500년대","intro":"호스피스라는 말은 아주 오래전 \u0027손님을 맞는 집\u0027에서 시작됐어요. 길 떠난 사람과 아픈 사람을 따뜻하게 받아 주던 마음이 천 년 넘게 이어져 왔답니다.","entries":[{"year":"고대 로마","title":"손님을 맞는 집, 호스피티움","text":"고대 로마 사람들은 낯선 길손을 재워 주는 일을 아주 소중하게 여겼어요. 이런 마음과 그런 집을 라틴어로 호스피티움(hospitium)이라고 불렀어요. 이 말에서 호스피스, 병원(hospital), 호텔(hotel) 같은 말이 갈라져 나왔어요. 호스피스의 뿌리는 \u0027돌봄과 환대\u0027인 셈이에요.","term":"환대: 찾아온 사람을 반갑고 따뜻하게 맞아 주는 일","svg":"\u003cpath d=\u0027M20 60 L60 25 L100 60\u0027/\u003e\u003cpath d=\u0027M28 56 L28 98 Q60 102 92 98 L92 56\u0027/\u003e\u003cpath d=\u0027M50 98 C50 80 52 72 60 72 C68 72 70 80 70 98\u0027/\u003e\u003cpath d=\u0027M36 66 C36 62 44 62 44 66 L44 76 C44 80 36 80 36 76 Z\u0027/\u003e\u003cpath d=\u0027M76 66 C76 62 84 62 84 66 L84 76 C84 80 76 80 76 76 Z\u0027/\u003e\u003cpath d=\u0027M60 25 C60 20 64 16 68 14\u0027/\u003e\u003cpath d=\u0027M84 36 L84 24 L92 24 L92 42\u0027/\u003e\u003cpath d=\u0027M12 100 Q60 108 108 100\u0027/\u003e\u003cpath d=\u0027M56 40 C58 44 62 44 64 40\u0027/\u003e\u003cpath d=\u0027M18 62 Q60 20 102 62\u0027/\u003e"},{"year":"4세기","title":"가난한 사람과 아픈 사람을 위한 집","text":"로마 제국에서 기독교가 퍼지자, 아픈 이웃을 돌보는 일을 신앙의 실천으로 여기게 됐어요. 4세기에 주교(교회의 지도자) 바실리우스는 가이사랴라는 도시에 가난한 사람과 환자를 함께 돌보는 큰 시설을 세웠어요. 이곳에서는 잠자리와 음식, 치료를 함께 나눠 주었어요. 오늘날 병원과 호스피스의 먼 조상이라고 할 수 있어요.","term":"주교: 기독교 교회에서 한 지역의 신자들을 이끄는 높은 성직자","svg":"\u003cpath d=\u0027M14 84 L106 84\u0027/\u003e\u003cpath d=\u0027M14 70 L14 98\u0027/\u003e\u003cpath d=\u0027M106 84 L106 98\u0027/\u003e\u003cpath d=\u0027M14 76 C40 72 80 72 106 76\u0027/\u003e\u003cpath d=\u0027M20 70 C20 56 30 52 40 56 C46 58 46 70 44 70\u0027/\u003e\u003cpath d=\u0027M50 66 C70 56 90 60 100 70\u0027/\u003e\u003cpath d=\u0027M18 70 L100 70\u0027/\u003e\u003cpath d=\u0027M28 56 C26 44 36 38 44 44\u0027/\u003e\u003cpath d=\u0027M70 30 L70 44 M63 37 L77 37\u0027/\u003e\u003cpath d=\u0027M60 20 C66 16 74 18 78 24\u0027/\u003e"},{"year":"6세기","title":"수도원의 규칙, 손님은 그리스도처럼","text":"6세기에 베네딕토라는 수도사가 수도원의 생활 규칙을 만들었어요. 이 규칙에는 찾아오는 손님을 그리스도를 맞이하듯 정성껏 대하고, 아픈 사람을 먼저 돌보라는 내용이 담겨 있어요. 그래서 유럽의 수도원에는 손님방과 환자를 돌보는 병실이 자연스럽게 생겼어요. 수도사들은 약초를 키워 약으로 쓰기도 했어요.","term":"수도원: 수도사들이 모여 기도하고 일하며 함께 사는 곳","svg":"\u003cpath d=\u0027M16 36 C34 28 50 30 60 38 C70 30 86 28 104 36 L104 90 C86 82 70 84 60 92 C50 84 34 82 16 90 Z\u0027/\u003e\u003cpath d=\u0027M60 38 L60 92\u0027/\u003e\u003cpath d=\u0027M26 46 C36 44 46 46 52 50\u0027/\u003e\u003cpath d=\u0027M26 56 C36 54 46 56 52 60\u0027/\u003e\u003cpath d=\u0027M26 66 C36 64 46 66 52 70\u0027/\u003e\u003cpath d=\u0027M68 50 C74 46 84 44 94 46\u0027/\u003e\u003cpath d=\u0027M68 60 C74 56 84 54 94 56\u0027/\u003e\u003cpath d=\u0027M68 70 C74 66 84 64 94 66\u0027/\u003e\u003cpath d=\u0027M20 94 C40 90 52 96 60 100 C68 96 80 90 100 94\u0027/\u003e"},{"year":"중세","title":"순례자들의 쉼터","text":"중세 유럽 사람들은 성지(신앙에서 소중하게 여기는 장소)를 찾아 먼 길을 걸어가는 순례를 많이 했어요. 길 위의 순례자는 지치고 아프고 굶주리기 쉬웠어요. 그래서 수도원과 교회는 길가에 쉼터를 세워 잠자리와 먹을 것, 치료를 주었어요. 이런 쉼터를 호스피스(hospice)라고 부르기 시작했고, 죽음을 앞둔 사람도 이곳에서 편히 쉬었어요.","term":"순례: 신앙에서 소중한 곳을 찾아 먼 길을 걸어가는 여행","svg":"\u003cpath d=\u0027M30 56 C30 40 90 40 90 56\u0027/\u003e\u003cpath d=\u0027M16 58 C40 64 80 64 104 58\u0027/\u003e\u003cpath d=\u0027M30 56 C50 60 70 60 90 56\u0027/\u003e\u003cpath d=\u0027M60 66 C52 70 52 84 60 88 C68 84 68 70 60 66\u0027/\u003e\u003cpath d=\u0027M60 88 L52 108\u0027/\u003e\u003cpath d=\u0027M60 88 L68 108\u0027/\u003e\u003cpath d=\u0027M86 40 C90 60 88 90 88 108\u0027/\u003e\u003cpath d=\u0027M82 44 C86 38 94 38 94 44\u0027/\u003e\u003cpath d=\u0027M40 72 C46 78 52 80 56 80\u0027/\u003e\u003cpath d=\u0027M96 70 C100 74 100 80 96 84\u0027/\u003e"},{"year":"12세기","title":"성 요한 기사단의 병원","text":"예루살렘에는 순례자를 돌보는 병원이 있었고, 여기서 성 요한 기사단이 생겨났어요. 12세기 초에 교황이 이 단체를 공식으로 인정했어요. 기사단은 아픈 순례자를 먹이고 재우고 치료하는 일을 맡았고, 나중에는 길을 지키는 일도 함께 했어요. 그들의 여덟 끝 십자가는 지금도 구호 단체의 상징으로 남아 있어요.","term":"기사단: 신앙의 뜻으로 모여 봉사하고 지키는 일을 하던 단체","svg":"\u003cpath d=\u0027M60 16 L68 36 L60 44 L52 36 Z\u0027/\u003e\u003cpath d=\u0027M104 60 L84 68 L76 60 L84 52 Z\u0027/\u003e\u003cpath d=\u0027M60 104 L52 84 L60 76 L68 84 Z\u0027/\u003e\u003cpath d=\u0027M16 60 L36 52 L44 60 L36 68 Z\u0027/\u003e\u003cpath d=\u0027M68 36 L84 52\u0027/\u003e\u003cpath d=\u0027M84 68 L68 84\u0027/\u003e\u003cpath d=\u0027M52 84 L36 68\u0027/\u003e\u003cpath d=\u0027M36 52 L52 36\u0027/\u003e\u003cpath d=\u0027M60 44 C66 50 70 54 76 60 C70 66 66 70 60 76 C54 70 50 66 44 60 C50 54 54 50 60 44\u0027/\u003e\u003cpath d=\u0027M60 54 C64 54 66 56 66 60 C66 64 64 66 60 66 C56 66 54 64 54 60 C54 56 56 54 60 54\u0027/\u003e\u003cpath d=\u0027M60 10 C88 10 110 32 110 60 C110 88 88 110 60 110 C32 110 10 88 10 60 C10 32 32 10 60 10\u0027/\u003e"},{"year":"1500년대","title":"수도원이 문을 닫던 시대","text":"1500년대에 유럽에서는 종교 개혁이라는 큰 변화가 일어났어요. 영국에서는 1530년대 후반부터 왕 헨리 8세가 수도원을 닫게 했어요. 그 바람에 수도원이 하던 병자 돌봄과 순례자 쉼터도 함께 사라지거나 크게 줄었어요. 돌봄의 일은 점점 도시와 나라가 맡게 되었고, 오늘날 병원 제도로 이어졌어요.","term":"종교 개혁: 1500년대에 유럽 교회의 모습과 권위를 바꾸려 한 큰 운동","svg":"\u003cpath d=\u0027M14 100 L106 100\u0027/\u003e\u003cpath d=\u0027M30 100 L30 54 C30 30 70 30 70 54 L70 100\u0027/\u003e\u003cpath d=\u0027M38 100 L38 56 C38 40 62 40 62 56 L62 100\u0027/\u003e\u003cpath d=\u0027M70 100 L70 70 L84 62 L84 100\u0027/\u003e\u003cpath d=\u0027M84 80 L98 74 L98 100\u0027/\u003e\u003cpath d=\u0027M20 100 L20 40\u0027/\u003e\u003cpath d=\u0027M20 40 C22 34 26 32 30 34\u0027/\u003e\u003cpath d=\u0027M46 70 C48 66 52 66 54 70\u0027/\u003e\u003cpath d=\u0027M88 100 C86 92 90 88 88 84\u0027/\u003e\u003cpath d=\u0027M76 30 C80 24 86 26 90 30 C94 26 100 26 104 30\u0027/\u003e"}]},{"era":"근대 초기","range":"1600~1899","intro":"1600년대부터 1800년대까지는 병원과 호스피스가 같은 뿌리에서 자라던 시기예요. 종교와 자선의 마음으로 가난하고 아픈 사람, 죽음을 앞둔 사람을 돌보는 공동체가 하나둘 생겨났어요.","entries":[{"year":"1625","title":"성 빈센트 드 폴의 선교회","text":"프랑스의 사제 빈센트 드 폴은 1625년에 가난한 사람들을 돕는 선교회를 세웠어요. 그는 병들고 버림받은 사람들을 직접 찾아가 돌보는 일을 중요하게 생각했어요. 이런 생각은 훗날 호스피스를 이끈 많은 돌봄 공동체에 큰 영향을 주었어요. 빈센트는 \u0027자선(慈善)\u0027을 말보다 행동으로 보여 준 사람으로 기억돼요.","term":"자선: 어려운 사람을 불쌍히 여겨 대가 없이 도와주는 일","svg":"\u003cpath d=\"M60 38 C50 30 30 28 14 32 L14 90 C30 86 50 88 60 96\"/\u003e\u003cpath d=\"M60 38 C70 30 90 28 106 32 L106 90 C90 86 70 88 60 96\"/\u003e\u003cpath d=\"M60 38 L60 96\"/\u003e\u003cpath d=\"M22 42 C34 40 46 42 54 46\"/\u003e\u003cpath d=\"M22 54 C34 52 46 54 54 58\"/\u003e\u003cpath d=\"M22 66 C34 64 46 66 54 70\"/\u003e\u003cpath d=\"M66 46 C74 42 86 40 98 42\"/\u003e\u003cpath d=\"M66 58 C74 54 86 52 98 54\"/\u003e\u003cpath d=\"M66 70 C74 66 86 64 98 66\"/\u003e\u003cpath d=\"M18 96 C40 94 52 100 60 104 C68 100 80 94 102 96\"/\u003e"},{"year":"1633","title":"자선 수녀회의 탄생","text":"1633년에 빈센트 드 폴은 루이즈 드 마리약과 함께 \u0027자선 수녀회\u0027를 만들었어요. 이 수녀들은 수도원 안에만 머물지 않고 거리와 가난한 집으로 나가 아픈 사람을 돌봤어요. 환자의 몸뿐 아니라 마음까지 보살피는 모습은 오늘날 호스피스 돌봄의 모습과 닮았어요. 이렇게 돌봄을 \u0027직업처럼 꾸준히 하는 일\u0027로 이어 간 것이 큰 의미가 있어요.","term":"수녀회: 같은 믿음을 가진 여성들이 함께 지내며 봉사하는 모임","svg":"\u003cpath d=\"M60 92 C30 70 20 50 30 36 C40 24 54 28 60 40 C66 28 80 24 90 36 C100 50 90 70 60 92 Z\"/\u003e\u003cpath d=\"M60 40 C58 50 62 56 60 64\"/\u003e\u003cpath d=\"M44 46 C40 52 42 58 48 64\"/\u003e\u003cpath d=\"M76 46 C80 52 78 58 72 64\"/\u003e\u003cpath d=\"M12 84 C24 80 36 88 48 98 C54 104 64 104 72 98\"/\u003e\u003cpath d=\"M108 84 C96 80 84 88 72 98\"/\u003e\u003cpath d=\"M12 84 C10 92 14 100 22 106\"/\u003e\u003cpath d=\"M108 84 C110 92 106 100 98 106\"/\u003e\u003cpath d=\"M30 106 C46 112 74 112 90 106\"/\u003e\u003cpath d=\"M60 10 L60 22\"/\u003e\u003cpath d=\"M52 16 L68 16\"/\u003e"},{"year":"1815","title":"아일랜드 자선 수녀회","text":"1815년에 아일랜드의 메리 에이켄헤드가 \u0027아일랜드 자선 수녀회\u0027를 세웠어요. 수녀들은 가난한 사람들의 집을 찾아가고 병원에서 환자를 돌보는 일을 했어요. 이 수녀회는 나중에 죽음을 앞둔 사람을 위한 시설을 여는 바탕이 되었어요. 한 사람의 용기 있는 결심이 오랫동안 이어지는 돌봄의 뿌리가 된 거예요.","term":"설립: 어떤 단체나 시설을 처음 세우는 일","svg":"\u003cpath d=\"M20 100 L100 100\"/\u003e\u003cpath d=\"M26 100 L26 58 L94 58 L94 100\"/\u003e\u003cpath d=\"M20 58 L60 38 L100 58\"/\u003e\u003cpath d=\"M52 100 L52 78 C52 70 68 70 68 78 L68 100\"/\u003e\u003cpath d=\"M34 70 C34 66 42 66 42 70 L42 80 L34 80 Z\"/\u003e\u003cpath d=\"M78 70 C78 66 86 66 86 70 L86 80 L78 80 Z\"/\u003e\u003cpath d=\"M60 38 L60 22\"/\u003e\u003cpath d=\"M54 28 L66 28\"/\u003e\u003cpath d=\"M40 58 L40 100\"/\u003e\u003cpath d=\"M80 58 L80 100\"/\u003e\u003cpath d=\"M56 48 C58 44 62 44 64 48\"/\u003e\u003cpath d=\"M24 108 C48 112 72 112 96 108\"/\u003e"},{"year":"1842","title":"잔 가르니에와 리옹 칼베리","text":"1842년에 프랑스 리옹에서 잔 가르니에가 \u0027칼베리 부인회\u0027를 시작했어요. 이 모임은 죽음을 앞둔 사람들을 위해 \u0027칼베리\u0027라는 이름의 돌봄의 집을 열었어요. 잔 가르니에는 남편과 아이들을 일찍 떠나보낸 아픔을 겪었지만, 그 슬픔을 다른 사람을 돕는 힘으로 바꾸었어요. 칼베리는 호스피스라는 말이 자리 잡기 전에 생긴 소중한 돌봄의 집이에요.","term":"칼베리: 예수가 십자가에 달렸다고 전해지는 언덕 이름으로, 고통 속의 위로를 뜻해요","svg":"\u003cpath d=\"M52 50 C56 52 64 52 68 50 L68 100 C68 106 52 106 52 100 Z\"/\u003e\u003cpath d=\"M60 50 L60 40\"/\u003e\u003cpath d=\"M60 14 C48 28 50 38 60 40 C70 38 72 28 60 14 Z\"/\u003e\u003cpath d=\"M60 22 C56 30 56 34 60 36\"/\u003e\u003cpath d=\"M52 66 C50 74 54 78 52 86\"/\u003e\u003cpath d=\"M30 106 C50 112 70 112 90 106\"/\u003e\u003cpath d=\"M36 32 C32 26 30 22 34 16\"/\u003e\u003cpath d=\"M84 32 C88 26 90 22 86 16\"/\u003e\u003cpath d=\"M28 52 C34 48 36 44 36 40\"/\u003e\u003cpath d=\"M92 52 C86 48 84 44 84 40\"/\u003e"},{"year":"1860","title":"나이팅게일 간호학교","text":"1860년에 영국의 플로렌스 나이팅게일이 런던의 성 토머스 병원에 간호학교를 열었어요. 그녀는 깨끗한 환경과 환자를 세심하게 살피는 일이 회복과 편안함에 중요하다고 가르쳤어요. 이렇게 간호가 전문 교육을 받는 직업으로 자리 잡으면서 아픈 사람을 돌보는 수준이 높아졌어요. 이런 변화는 훗날 호스피스에서 일하는 간호사들의 바탕이 되었어요.","term":"간호: 아픈 사람을 살피고 돌보며 건강을 되찾도록 돕는 일","svg":"\u003cpath d=\"M38 100 C38 92 82 92 82 100 C82 106 38 106 38 100 Z\"/\u003e\u003cpath d=\"M50 92 C48 80 50 70 52 62\"/\u003e\u003cpath d=\"M70 92 C72 80 70 70 68 62\"/\u003e\u003cpath d=\"M46 62 C46 54 74 54 74 62 C74 66 46 66 46 62 Z\"/\u003e\u003cpath d=\"M52 56 C52 44 68 44 68 56\"/\u003e\u003cpath d=\"M60 44 L60 36\"/\u003e\u003cpath d=\"M60 16 C52 26 54 34 60 36 C66 34 68 26 60 16 Z\"/\u003e\u003cpath d=\"M40 40 C32 34 28 28 30 22\"/\u003e\u003cpath d=\"M80 40 C88 34 92 28 90 22\"/\u003e\u003cpath d=\"M56 74 C58 78 62 78 64 74\"/\u003e\u003cpath d=\"M74 64 C88 60 98 68 94 80 C90 88 82 88 78 86\"/\u003e"},{"year":"1879","title":"더블린 성모 호스피스","text":"1879년에 아일랜드 더블린에 \u0027성모 호스피스\u0027가 문을 열었어요. 이 호스피스는 앞서 자선 수녀회를 세운 메리 에이켄헤드 수녀의 뜻을 이은 수녀들이 운영했어요. 죽음을 앞둔 가난한 환자들이 이곳에서 편안한 침대와 따뜻한 보살핌을 받을 수 있었어요. 이곳은 오늘날의 호스피스로 이어지는 중요한 역사적 장소로 꼽혀요.","term":"호스피스: 죽음을 앞둔 사람이 편안하게 지내도록 몸과 마음을 돌보는 곳이나 그 돌봄","svg":"\u003cpath d=\"M12 96 L108 96\"/\u003e\u003cpath d=\"M16 96 L16 50\"/\u003e\u003cpath d=\"M104 96 L104 66\"/\u003e\u003cpath d=\"M16 78 L104 78\"/\u003e\u003cpath d=\"M20 72 C20 62 34 62 40 66 C36 72 28 76 20 72 Z\"/\u003e\u003cpath d=\"M44 74 C60 60 84 66 100 72 L100 78 L44 78 Z\"/\u003e\u003cpath d=\"M16 50 C14 44 22 44 20 50\"/\u003e\u003cpath d=\"M24 106 C44 110 76 110 96 106\"/\u003e\u003cpath d=\"M60 24 L60 44\"/\u003e\u003cpath d=\"M50 34 L70 34\"/\u003e"}]},{"era":"현대 호스피스의 탄생","range":"1900~1969","intro":"1900년대 초부터 1960년대까지, 아픈 사람의 마지막 시간을 따뜻하게 돌보는 일이 하나의 제대로 된 분야로 자라났어요. 이 시기에 시슬리 손더스 같은 사람들이 나타나 오늘날 호스피스의 모습을 만들었어요.","entries":[{"year":"1905","title":"성 요셉 호스피스 문을 열다","text":"1905년 영국 런던에 성 요셉 호스피스가 문을 열었어요. 아일랜드에서 온 자선의 수녀회(가난하고 아픈 사람을 돌보는 가톨릭 수녀들의 모임)가 세웠어요. 이곳은 치료가 어려운 가난한 환자들이 편안하게 마지막 시간을 보낼 수 있는 쉼터가 되어 주었어요. 훗날 시슬리 손더스도 이곳에서 일하며 많은 것을 배웠어요.","term":"호스피스: 죽음을 앞둔 사람과 가족이 편안하도록 돕는 돌봄, 또는 그런 돌봄을 하는 곳","svg":"\u003cpath d=\"M20 60 L60 24 L100 60\"/\u003e\u003cpath d=\"M28 56 L28 98\"/\u003e\u003cpath d=\"M92 56 L92 98\"/\u003e\u003cpath d=\"M20 98 L100 98\"/\u003e\u003cpath d=\"M50 98 L50 74 Q50 66 60 66 Q70 66 70 74 L70 98\"/\u003e\u003cpath d=\"M34 70 Q38 64 42 70 Q38 76 34 70 Z\"/\u003e\u003cpath d=\"M78 70 Q82 64 86 70 Q82 76 78 70 Z\"/\u003e\u003cpath d=\"M60 24 L60 14\"/\u003e\u003cpath d=\"M55 18 L65 18\"/\u003e\u003cpath d=\"M44 40 Q60 30 76 40\"/\u003e\u003cpath d=\"M10 104 Q60 110 110 104\"/\u003e"},{"year":"1948","title":"손더스와 데이비드 타스마의 만남","text":"시슬리 손더스는 간호사와 사회복지사로 일하다가 나중에 의사가 된 영국 사람이에요. 1948년에 그녀는 폴란드 출신의 암 환자 데이비드 타스마를 만나 깊은 이야기를 나누었어요. 타스마는 세상을 떠나면서 자신의 재산 일부를 남겼고, 손더스는 그 마음을 이어 환자를 위한 집을 짓겠다고 마음먹었어요. 한 사람과의 만남이 호스피스의 씨앗이 된 셈이에요.","term":"사회복지사: 어려움에 처한 사람의 생활과 마음을 돕는 전문가","svg":"\u003cpath d=\"M48 56 L48 100\"/\u003e\u003cpath d=\"M72 56 L72 100\"/\u003e\u003cpath d=\"M48 56 Q60 62 72 56\"/\u003e\u003cpath d=\"M40 100 Q60 108 80 100\"/\u003e\u003cpath d=\"M60 56 L60 46\"/\u003e\u003cpath d=\"M60 46 C50 34 56 24 60 12 C64 24 70 34 60 46 Z\"/\u003e\u003cpath d=\"M60 40 C56 34 58 28 60 24 C62 28 64 34 60 40\"/\u003e\u003cpath d=\"M54 76 Q60 80 66 76\"/\u003e\u003cpath d=\"M30 108 Q60 114 90 108\"/\u003e\u003cpath d=\"M36 30 Q30 24 36 18\"/\u003e\u003cpath d=\"M84 30 Q90 24 84 18\"/\u003e"},{"year":"1967","title":"성 크리스토퍼 호스피스의 탄생","text":"1967년 손더스는 런던에 성 크리스토퍼 호스피스를 열었어요. 이곳은 현대 호스피스의 출발점으로 꼽혀요. 병원처럼 치료만 하는 곳이 아니라, 환자가 남은 시간을 자기답게 보내도록 돕는 집 같은 공간이었어요. 정원과 넓은 창이 있어서 환자들이 햇빛과 바깥 풍경을 느낄 수 있었어요.","term":"현대 호스피스: 병을 고치는 대신 고통을 덜고 삶의 질을 높이는 데 집중하는 돌봄","svg":"\u003cpath d=\"M14 100 L106 100\"/\u003e\u003cpath d=\"M22 100 L22 50 L98 50 L98 100\"/\u003e\u003cpath d=\"M16 50 L60 26 L104 50\"/\u003e\u003cpath d=\"M32 62 L44 62 L44 76 L32 76 Z\"/\u003e\u003cpath d=\"M76 62 L88 62 L88 76 L76 76 Z\"/\u003e\u003cpath d=\"M54 100 L54 80 Q54 72 60 72 Q66 72 66 80 L66 100\"/\u003e\u003cpath d=\"M32 84 L44 84\"/\u003e\u003cpath d=\"M76 84 L88 84\"/\u003e\u003cpath d=\"M60 26 L60 16 L72 20 L60 24\"/\u003e\u003cpath d=\"M10 106 Q30 100 50 108\"/\u003e\u003cpath d=\"M70 108 Q90 100 112 106\"/\u003e"},{"year":"1967","title":"통증을 미리 막는 새로운 방법","text":"성 크리스토퍼 호스피스에서는 통증을 참지 않아도 된다는 원칙을 세웠어요. 환자가 아프다고 말할 때까지 기다리지 않고, 시간을 정해 규칙적으로 진통제를 드려서 통증이 심해지기 전에 막았어요. 이렇게 하면 환자는 아픔에 대한 두려움에서 벗어나 가족과 이야기하고 웃을 힘을 얻을 수 있어요. 이 방법은 오늘날 통증 조절의 기본이 되었어요.","term":"진통제: 아픔을 줄여 주는 약","svg":"\u003cpath d=\"M44 36 L76 36\"/\u003e\u003cpath d=\"M48 36 L48 28 L72 28 L72 36\"/\u003e\u003cpath d=\"M44 36 Q40 44 40 52 L40 96 Q40 102 46 102 L74 102 Q80 102 80 96 L80 52 Q80 44 76 36\"/\u003e\u003cpath d=\"M40 60 L80 60\"/\u003e\u003cpath d=\"M52 76 L68 76\"/\u003e\u003cpath d=\"M60 68 L60 84\"/\u003e\u003cpath d=\"M20 40 C14 52 14 58 20 62 C26 58 26 52 20 40 Z\"/\u003e\u003cpath d=\"M100 22 C108 22 112 28 112 34 C112 40 108 46 100 46 C92 46 88 40 88 34 C88 28 92 22 100 22 Z\"/\u003e\u003cpath d=\"M100 28 L100 34 L105 37\"/\u003e\u003cpath d=\"M22 78 Q26 74 30 78\"/\u003e\u003cpath d=\"M88 70 Q96 66 104 70\"/\u003e"},{"year":"1967","title":"몸과 마음을 함께 돌보는 전인적 돌봄","text":"손더스는 환자의 고통이 몸의 아픔만이 아니라고 보았어요. 마음의 불안, 가족과의 관계, 삶의 의미에 대한 고민까지 모두 합쳐진 고통이라는 뜻에서 총체적 고통이라고 불렀어요. 그래서 성 크리스토퍼 호스피스에서는 의사, 간호사, 사회복지사, 성직자가 한 팀이 되어 환자를 돌봤어요. 이런 돌봄을 전인적 돌봄이라고 하고, 지금도 호스피스의 중심 생각이에요.","term":"전인적 돌봄: 몸, 마음, 사회적 관계, 영적인 부분까지 한 사람 전체를 함께 돌보는 것","svg":"\u003cpath d=\"M60 70 C30 50 34 26 50 26 C56 26 60 30 60 34 C60 30 64 26 70 26 C86 26 90 50 60 70 Z\"/\u003e\u003cpath d=\"M14 84 C30 76 46 80 56 90\"/\u003e\u003cpath d=\"M106 84 C90 76 74 80 64 90\"/\u003e\u003cpath d=\"M14 84 L14 100\"/\u003e\u003cpath d=\"M106 84 L106 100\"/\u003e\u003cpath d=\"M14 100 C40 104 50 100 60 96\"/\u003e\u003cpath d=\"M106 100 C80 104 70 100 60 96\"/\u003e\u003cpath d=\"M56 90 C58 94 62 94 64 90\"/\u003e\u003cpath d=\"M24 82 Q28 90 36 88\"/\u003e\u003cpath d=\"M96 82 Q92 90 84 88\"/\u003e\u003cpath d=\"M60 38 Q54 34 52 40\"/\u003e\u003cpath d=\"M40 98 Q48 96 52 92\"/\u003e"},{"year":"1969","title":"퀴블러로스의 죽음과 죽어감","text":"1969년 스위스 출신의 정신과 의사 엘리자베스 퀴블러로스가 『죽음과 죽어감』이라는 책을 냈어요. 그녀는 죽음을 앞둔 환자들의 이야기를 직접 듣고, 많은 사람이 부정, 분노, 타협, 우울, 수용이라는 마음의 단계를 겪는다고 소개했어요. 이 책은 죽음을 말하기 꺼리던 사회에 환자의 마음에 귀 기울이자는 생각을 널리 퍼뜨렸어요. 호스피스가 세상에 알려지는 데에도 큰 힘이 되었어요.","term":"수용: 피할 수 없는 일을 있는 그대로 받아들이는 마음","svg":"\u003cpath d=\"M60 36 C46 28 28 28 14 34 L14 92 C28 86 46 86 60 94\"/\u003e\u003cpath d=\"M60 36 C74 28 92 28 106 34 L106 92 C92 86 74 86 60 94\"/\u003e\u003cpath d=\"M60 36 L60 94\"/\u003e\u003cpath d=\"M22 46 C32 44 44 44 52 48\"/\u003e\u003cpath d=\"M22 58 C32 56 44 56 52 60\"/\u003e\u003cpath d=\"M22 70 C32 68 44 68 52 72\"/\u003e\u003cpath d=\"M68 48 C76 44 88 44 98 46\"/\u003e\u003cpath d=\"M68 60 C76 56 88 56 98 58\"/\u003e\u003cpath d=\"M68 72 C76 68 88 68 98 70\"/\u003e\u003cpath d=\"M60 10 L62 16 L68 16 L63 20 L65 26 L60 22 L55 26 L57 20 L52 16 L58 16 Z\"/\u003e\u003cpath d=\"M10 100 Q60 108 110 100\"/\u003e"}]},{"era":"세계로 퍼진 호스피스","range":"1970~1989","intro":"영국에서 시작된 호스피스는 1970년대부터 미국과 캐나다 같은 여러 나라로 퍼져 나갔어요. 이 시기에 호스피스는 작은 시작에서 벗어나 병원, 법, 의학 분야에 자리를 잡아 가기 시작했어요.","entries":[{"year":"1974","title":"미국 첫 호스피스, 코네티컷","text":"1974년에 미국 코네티컷주에서 \u0027코네티컷 호스피스\u0027가 문을 열었어요. 간호사였던 플로렌스 월드(Florence Wald) 같은 의료진이 영국의 호스피스를 보고 미국에도 필요하다고 생각해서 만들었어요. 처음에는 병원 건물 없이, 집에서 지내는 환자를 의료진이 찾아가서 돌보는 방식으로 시작했어요. 이 일을 계기로 미국 곳곳에서 호스피스를 만들려는 움직임이 커졌어요.","term":"재가 호스피스: 환자가 병원에 머물지 않고 집에서 지내며 의료진의 방문 돌봄을 받는 방식","svg":"\u003cpath d=\"M16 56 L60 20 L104 56\"/\u003e\u003cpath d=\"M24 56 Q60 28 96 56\"/\u003e\u003cpath d=\"M26 54 L26 100\"/\u003e\u003cpath d=\"M94 54 L94 100\"/\u003e\u003cpath d=\"M18 100 Q60 104 102 100\"/\u003e\u003cpath d=\"M52 100 L52 72 Q60 62 68 72 L68 100\"/\u003e\u003cpath d=\"M34 66 Q40 64 46 66 L46 78 Q40 80 34 78 Z\"/\u003e\u003cpath d=\"M74 66 Q80 64 86 66 L86 78 Q80 80 74 78 Z\"/\u003e\u003cpath d=\"M78 36 L78 22 L88 22 L88 44\"/\u003e\u003cpath d=\"M83 18 C78 12 90 10 84 3\"/\u003e\u003cpath d=\"M60 52 C56 46 50 50 54 54 C56 56 60 58 60 58 C60 58 64 56 66 54 C70 50 64 46 60 52\"/\u003e\u003cpath d=\"M52 100 C48 108 40 112 30 116 M68 100 C72 108 80 112 90 116\"/\u003e"},{"year":"1975","title":"캐나다의 완화의료","text":"1975년에 캐나다 몬트리올의 병원에서 완화의료(palliative care) 병동이 문을 열었어요. 의사 발푸어 마운트(Balfour Mount)가 이 일을 이끌었고, \u0027완화의료\u0027라는 말을 널리 쓰기 시작했어요. 호스피스라는 말이 낯설게 느껴질 수 있어서, 병원 안에서도 쓰기 쉬운 이름을 고른 거예요. 이렇게 호스피스의 생각이 일반 병원 안으로 들어오게 되었어요.","term":"완화의료: 병을 낫게 하기보다 아픔과 힘든 마음을 덜어 주어 편안하게 지내도록 돕는 돌봄","svg":"\u003cpath d=\"M60 14 C86 34 96 62 60 100\"/\u003e\u003cpath d=\"M60 14 C34 34 24 62 60 100\"/\u003e\u003cpath d=\"M60 100 L60 112\"/\u003e\u003cpath d=\"M60 24 L60 100\"/\u003e\u003cpath d=\"M60 44 C68 46 74 42 80 38\"/\u003e\u003cpath d=\"M60 44 C52 46 46 42 40 38\"/\u003e\u003cpath d=\"M60 62 C70 64 78 58 86 52\"/\u003e\u003cpath d=\"M60 62 C50 64 42 58 34 52\"/\u003e\u003cpath d=\"M60 80 C68 80 74 74 80 70\"/\u003e\u003cpath d=\"M60 80 C52 80 46 74 40 70\"/\u003e\u003cpath d=\"M100 16 L100 28 M94 22 L106 22\"/\u003e"},{"year":"1982","title":"미국 정부, 호스피스를 인정하다","text":"1982년에 미국 의회는 호스피스 돌봄 비용을 노인 건강보험인 메디케어(Medicare)에서 내 주는 법을 통과시켰어요. 그전에는 호스피스를 이용하려면 비용을 대부분 가족이 감당하거나 기부에 기대야 했어요. 이 법은 호스피스가 나라의 제도 안에서 인정받는 중요한 걸음이었어요. 이제 더 많은 환자와 가족이 부담을 덜고 호스피스를 이용할 길이 열렸어요.","term":"메디케어: 미국에서 65세 이상 노인 등을 위해 나라가 운영하는 건강보험","svg":"\u003cpath d=\"M14 44 L60 16 L106 44 Z\"/\u003e\u003cpath d=\"M24 42 L60 24 L96 42\"/\u003e\u003cpath d=\"M16 50 L104 50\"/\u003e\u003cpath d=\"M28 52 C26 70 30 86 28 98\"/\u003e\u003cpath d=\"M44 52 C42 70 46 86 44 98\"/\u003e\u003cpath d=\"M60 52 C58 70 62 86 60 98\"/\u003e\u003cpath d=\"M76 52 C74 70 78 86 76 98\"/\u003e\u003cpath d=\"M92 52 C90 70 94 86 92 98\"/\u003e\u003cpath d=\"M14 98 L106 98 L106 106 L14 106 Z\"/\u003e\u003cpath d=\"M20 106 L20 112 L100 112 L100 106\"/\u003e\u003cpath d=\"M60 30 C66 30 66 38 60 38 C54 38 54 30 60 30\"/\u003e"},{"year":"1983","title":"메디케어 호스피스 급여 시작","text":"1982년에 만든 법에 따라, 1983년부터 미국에서 메디케어의 호스피스 급여가 실제로 시작되었어요. 호스피스를 이용하는 환자는 병원비 걱정을 한결 덜고 편안한 돌봄을 받을 수 있게 되었어요. 이 제도가 생기자 호스피스 기관이 빠르게 늘어났어요. 호스피스가 한 나라의 보험 제도에 들어간 대표적인 사례가 되었어요.","term":"급여: 건강보험이 치료나 돌봄 비용의 일부 또는 전부를 대신 내 주는 것","svg":"\u003cpath d=\"M32 14 L78 14 L94 30 L94 106 L32 106 Z\"/\u003e\u003cpath d=\"M78 14 L78 30 L94 30\"/\u003e\u003cpath d=\"M42 24 Q50 22 62 24\"/\u003e\u003cpath d=\"M42 42 Q60 40 84 42\"/\u003e\u003cpath d=\"M42 54 Q60 52 84 54\"/\u003e\u003cpath d=\"M42 66 Q56 64 66 66\"/\u003e\u003cpath d=\"M60 92 C48 84 46 76 54 76 C58 76 60 80 60 80 C60 80 62 76 66 76 C74 76 72 84 60 92\"/\u003e\u003cpath d=\"M100 70 L108 62 L112 66 L104 76 Z\"/\u003e\u003cpath d=\"M38 98 Q46 96 54 98\"/\u003e\u003cpath d=\"M70 98 Q78 96 86 98\"/\u003e"},{"year":"1986","title":"세계보건기구의 암 통증 지침","text":"1986년에 세계보건기구(WHO)가 암 환자의 통증을 줄이는 방법을 담은 지침을 발표했어요. 통증이 약하면 약한 약부터, 더 아프면 점점 센 약으로 올라가는 \u0027단계별 진통제 사용법\u0027이 핵심이었어요. 이 지침 덕분에 전 세계 의료진이 아픔을 덜어 주는 기본 방법을 함께 배울 수 있었어요. 호스피스와 완화의료에서 통증 조절이 얼마나 중요한지를 널리 알린 일이었어요.","term":"세계보건기구(WHO): 전 세계 사람들의 건강을 위해 일하는 국제기구","svg":"\u003cpath d=\"M14 104 L106 104\"/\u003e\u003cpath d=\"M14 104 L14 86 L40 86 L40 68 L66 68 L66 50 L92 50 L92 32 L106 32\"/\u003e\u003cpath d=\"M106 32 L106 104\"/\u003e\u003cpath d=\"M40 86 L40 104\"/\u003e\u003cpath d=\"M66 68 L66 104\"/\u003e\u003cpath d=\"M92 50 L92 104\"/\u003e\u003cpath d=\"M96 6 L99 13 L107 14 C102 18 101 20 103 26 C97 22 95 22 89 26 C91 20 90 18 85 14 L93 13 Z\"/\u003e\u003cpath d=\"M18 70 C14 64 20 58 26 62 L34 70 C38 76 30 80 26 78 Z\"/\u003e\u003cpath d=\"M22 66 L30 74\"/\u003e\u003cpath d=\"M52 40 L52 48 M48 44 L56 44\"/\u003e"},{"year":"1987","title":"영국의 완화의학 전문과","text":"1987년에 영국에서 완화의학이 의사의 전문 분야(전문과)로 공식 인정되었어요. 호스피스가 시작된 나라에서 이 돌봄이 하나의 학문이 된 거예요. 이제 의사들이 완화의학을 정식으로 배우고 훈련받으며, 환자를 더 전문적으로 도울 수 있게 되었어요. 이 일은 호스피스가 따뜻한 마음에 더해 과학적인 지식도 갖춘 분야로 자리 잡았다는 뜻이에요.","term":"전문과: 의사가 특정 분야를 깊이 배우고 훈련받아 공식적으로 인정받은 진료 분야","svg":"\u003cpath d=\"M14 40 C30 34 48 36 60 46 L60 100 C48 90 30 88 14 94 Z\"/\u003e\u003cpath d=\"M106 40 C90 34 72 36 60 46 L60 100 C72 90 90 88 106 94 Z\"/\u003e\u003cpath d=\"M10 98 C28 92 46 94 60 104 C74 94 92 92 110 98\"/\u003e\u003cpath d=\"M22 50 C32 48 42 50 52 56\"/\u003e\u003cpath d=\"M22 62 C32 60 42 62 52 68\"/\u003e\u003cpath d=\"M22 74 C32 72 42 74 52 80\"/\u003e\u003cpath d=\"M98 50 C88 48 78 50 68 56\"/\u003e\u003cpath d=\"M98 62 C88 60 78 62 68 68\"/\u003e\u003cpath d=\"M60 8 L63 16 L72 17 C66 22 66 24 68 31 C62 27 58 27 52 31 C54 24 54 22 48 17 L57 16 Z\"/\u003e\u003cpath d=\"M40 22 L36 18 M80 22 L84 18\"/\u003e"}]},{"era":"한국의 호스피스","range":"1963~2015","intro":"우리나라에서는 1960년대에 수녀님들이 아픈 사람 곁을 지키면서 호스피스가 첫걸음을 뗐어요. 이후 병원, 학회, 정부와 법이 차례로 힘을 보태며 오늘의 모습으로 자라났어요.","entries":[{"year":"1963","title":"강릉 갈바리의원","text":"1963년 강릉에 갈바리의원이 문을 열었어요. 수녀님들이 운영한 이 작은 병원은 가난하고 아픈 사람들을 따뜻하게 돌봤어요. 치료만 하는 것이 아니라 마음까지 보살피려는 정신이 이곳에서 싹텄어요. 그래서 우리나라 호스피스의 뿌리로 자주 이야기돼요.","term":"의원: 규모가 작은 동네 병원","svg":"\u003cpath d=\u0027M15 58 L60 18 L105 58\u0027/\u003e\u003cpath d=\u0027M22 54 L22 102 L98 102 L98 54\u0027/\u003e\u003cpath d=\u0027M10 102 L110 102\u0027/\u003e\u003cpath d=\u0027M48 102 L48 72 Q60 62 72 72 L72 102\u0027/\u003e\u003cpath d=\u0027M84 38 L84 24 L94 24 L94 46\u0027/\u003e\u003cpath d=\u0027M28 66 L40 66 L40 80 L28 80 Z\u0027/\u003e\u003cpath d=\u0027M80 66 L92 66 L92 80 L80 80 Z\u0027/\u003e\u003cpath d=\u0027M34 66 L34 80\u0027/\u003e\u003cpath d=\u0027M86 66 L86 80\u0027/\u003e\u003cpath d=\u0027M60 6 L60 16\u0027/\u003e\u003cpath d=\u0027M55 10 L65 10\u0027/\u003e\u003cpath d=\u0027M15 58 Q38 40 60 28 Q82 40 105 58\u0027/\u003e"},{"year":"1965","title":"마리아의 작은 자매회","text":"1965년에는 마리아의 작은 자매회 수녀님들이 우리나라에서 활동을 이어 갔어요. 수녀님들은 가난하고 아픈 사람, 삶의 마지막을 앞둔 사람 곁에서 정성껏 돌봤어요. 이 따뜻한 돌봄이 사람들에게 호스피스의 마음을 알려 주었어요. 마치 어둠 속의 촛불처럼 환자와 가족에게 위로가 되었어요.","term":"수녀회: 수녀님들이 함께 기도하며 봉사하는 모임","svg":"\u003cpath d=\u0027M52 100 L52 58 Q60 54 68 58 L68 100 Q60 105 52 100\u0027/\u003e\u003cpath d=\u0027M60 52 C52 42 56 34 60 24 C64 34 68 42 60 52 Z\u0027/\u003e\u003cpath d=\u0027M60 48 C57 43 59 40 60 37 C62 41 63 44 60 48\u0027/\u003e\u003cpath d=\u0027M60 58 L60 52\u0027/\u003e\u003cpath d=\u0027M52 70 Q50 76 54 78\u0027/\u003e\u003cpath d=\u0027M68 76 Q71 82 66 86\u0027/\u003e\u003cpath d=\u0027M40 104 Q60 112 80 104\u0027/\u003e\u003cpath d=\u0027M40 40 L34 36\u0027/\u003e\u003cpath d=\u0027M80 40 L86 36\u0027/\u003e\u003cpath d=\u0027M42 28 L36 22\u0027/\u003e\u003cpath d=\u0027M78 28 L84 22\u0027/\u003e\u003cpath d=\u0027M52 64 Q60 68 68 64\u0027/\u003e"},{"year":"1988","title":"대학병원에서 시작한 호스피스","text":"1988년 가톨릭대학교 성모병원에서 호스피스 활동이 시작됐어요. 큰 종합병원 안에서 말기 환자를 위한 돌봄이 이루어진 것이 의미 있었어요. 의사와 간호사, 봉사자가 한 팀이 되어 환자와 가족을 도왔어요. 이때부터 호스피스가 병원 안에서도 점점 알려지기 시작했어요.","term":"말기 환자: 병이 깊어져 치료로 낫기 어려운 단계의 환자","svg":"\u003cpath d=\u0027M20 100 L20 40 L100 40 L100 100\u0027/\u003e\u003cpath d=\u0027M14 100 L106 100\u0027/\u003e\u003cpath d=\u0027M10 40 L60 14 L110 40\u0027/\u003e\u003cpath d=\u0027M30 50 L42 50 L42 62 L30 62 Z\u0027/\u003e\u003cpath d=\u0027M54 50 L66 50 L66 62 L54 62 Z\u0027/\u003e\u003cpath d=\u0027M78 50 L90 50 L90 62 L78 62 Z\u0027/\u003e\u003cpath d=\u0027M50 100 L50 80 Q60 72 70 80 L70 100\u0027/\u003e\u003cpath d=\u0027M60 20 L60 32\u0027/\u003e\u003cpath d=\u0027M55 26 L65 26\u0027/\u003e\u003cpath d=\u0027M30 74 L42 74 L42 86 L30 86 Z\u0027/\u003e\u003cpath d=\u0027M78 74 L90 74 L90 86 L78 86 Z\u0027/\u003e\u003cpath d=\u0027M20 40 Q60 32 100 40\u0027/\u003e"},{"year":"1991","title":"호스피스 교육의 시작","text":"1991년에는 가톨릭 쪽에서 호스피스 교육이 이루어졌어요. 돌봄을 잘하려면 마음만으로는 부족해서 배움이 꼭 필요해요. 통증을 줄이는 방법과 환자와 대화하는 법을 익히면 더 좋은 도움을 줄 수 있어요. 이런 교육 덕분에 호스피스를 맡을 사람들이 늘어났어요.","term":"통증 조절: 아픔을 약과 여러 방법으로 줄여 주는 일","svg":"\u003cpath d=\u0027M20 36 Q40 28 60 38 Q80 28 100 36 L100 90 Q80 82 60 92 Q40 82 20 90 Z\u0027/\u003e\u003cpath d=\u0027M60 38 L60 92\u0027/\u003e\u003cpath d=\u0027M28 48 Q42 44 52 50\u0027/\u003e\u003cpath d=\u0027M28 58 Q42 54 52 60\u0027/\u003e\u003cpath d=\u0027M28 68 Q42 64 52 70\u0027/\u003e\u003cpath d=\u0027M68 50 Q78 44 92 48\u0027/\u003e\u003cpath d=\u0027M68 60 Q78 54 92 58\u0027/\u003e\u003cpath d=\u0027M68 70 Q78 64 92 68\u0027/\u003e\u003cpath d=\u0027M20 90 Q40 98 60 98 Q80 98 100 90\u0027/\u003e\u003cpath d=\u0027M76 38 L76 54 L80 50 L84 54 L84 36\u0027/\u003e"},{"year":"1996","title":"한국호스피스완화의료학회","text":"1996년에 한국호스피스완화의료학회가 만들어졌어요. 학회는 의사, 간호사, 사회복지사 같은 전문가들이 모여 지식과 경험을 나누는 모임이에요. 여기서 좋은 돌봄의 기준을 함께 고민하고 연구했어요. 흩어져 있던 호스피스 활동이 하나로 힘을 모으는 계기가 되었어요.","term":"완화의료: 병을 고치기보다 고통을 덜어 삶의 질을 높이는 의료","svg":"\u003cpath d=\u0027M60 14 L71 44 L104 46 L78 66 L87 98 L60 80 L33 98 L42 66 L16 46 L49 44 Z\u0027/\u003e\u003cpath d=\u0027M60 34 L66 50 L84 51 L70 62 L75 80 L60 70 L45 80 L50 62 L36 51 L54 50 Z\u0027/\u003e\u003cpath d=\u0027M60 54 Q64 58 60 62 Q56 58 60 54\u0027/\u003e\u003cpath d=\u0027M100 14 L100 24\u0 요. 의사와 간호사 등이 집으로 찾아와 아픔을 살피고 가족도 도와줘요. 익숙한 집에서 가족과 함께 지내고 싶은 사람들에게 큰 힘이 되어요.","term":"가정형 호스피스: 전문 돌봄 팀이 집으로 찾아오는 호스피스","svg":"\u003cpath d=\"M14 58 L60 18 L106 58\"/\u003e\u003cpath d=\"M24 52 L24 100 L96 100 L96 52\"/\u003e\u003cpath d=\"M50 100 L50 76 C50 66 70 66 70 76 L70 100\"/\u003e\u003cpath d=\"M80 32 L80 20 L90 20 L90 42\"/\u003e\u003cpath d=\"M30 62 C30 58 40 58 40 62 L40 72 L30 72 Z\"/\u003e\u003cpath d=\"M80 62 C80 58 90 58 90 62 L90 72 L80 72 Z\"/\u003e\u003cpath d=\"M10 100 C40 104 80 104 110 100\"/\u003e\u003cpath d=\"M56 38 C56 32 64 32 64 38 C64 44 60 46 60 48 C60 46 56 44 56 38 Z\"/\u003e\u003cpath d=\"M104 100 C104 92 108 88 112 86\"/\u003e"},{"year":"2022","title":"어린이를 위한 소아 완화의료","text":"2022년 이후에는 아픈 어린이와 청소년을 위한 소아 완화의료에 대한 관심이 커졌어요. 아이들은 어른과 몸도 마음도 달라서 아이에게 맞는 돌봄이 따로 필요해요. 아이뿐 아니라 곁을 지키는 가족의 마음까지 함께 돌보는 것이 중요해요.","term":"소아 완화의료: 아픈 어린이와 가족의 고통을 덜어 주는 돌봄","svg":"\u003cpath d=\"M60 44 C60 30 38 28 38 44 C38 56 52 62 60 70 C68 62 82 56 82 44 C82 28 60 30 60 44 Z\"/\u003e\u003cpath d=\"M20 80 C30 78 40 84 50 88 C60 90 70 88 76 84\"/\u003e\u003cpath d=\"M20 80 L20 100 C34 104 50 104 64 100 C82 96 98 84 104 72\"/\u003e\u003cpath d=\"M76 84 C84 82 92 74 98 70 C102 68 106 70 104 74\"/\u003e\u003cpath d=\"M20 96 C14 94 12 84 20 80\"/\u003e\u003cpath d=\"M92 24 L94 31 L101 33 L94 35 L92 42 L90 35 L83 33 L90 31 Z\"/\u003e\u003cpath d=\"M26 34 L27 39 L32 40 L27 41 L26 46 L25 41 L20 40 L25 39 Z\"/\u003e\u003cpath d=\"M44 92 C52 96 62 96 70 92\"/\u003e\u003cpath d=\"M60 70 C60 74 60 78 60 82\"/\u003e"},{"year":"2024","title":"더 넓어지는 호스피스","text":"2024년 무렵부터는 호스피스를 이용할 수 있는 곳과 대상을 더 넓히려는 노력이 이어지고 있어요. 처음에는 암 환자 중심이었지만 암이 아닌 만성 질환으로 힘든 사람들도 돌봄을 받을 수 있도록 넓혀 가고 있어요. 누구나 필요할 때 가까운 곳에서 도움받는 것이 목표예요.","term":"비암성 질환: 암이 아닌 오래 앓는 병, 예를 들어 만성 간질환이나 폐질환 같은 것","svg":"\u003cpath d=\"M24 100 L24 38 L96 38 L96 100\"/\u003e\u003cpath d=\"M14 100 L106 100\"/\u003e\u003cpath d=\"M24 38 C40 30 80 30 96 38\"/\u003e\u003cpath d=\"M54 46 L66 46 L66 54 L74 54 L74 66 L66 66 const nav=document.getElementById('nav'),main=document.getElementById('main');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
DATA.forEach((e,i)=>{
 nav.insertAdjacentHTML('beforeend',`<a href="#e${i}">${esc(e.era)}</a>`);
 let h=`<section class="era" id="e${i}"><h2>${esc(e.era)}</h2><div class="range">${esc(e.range)}</div><p>${esc(e.intro)}</p>`;
 e.entries.forEach(x=>{h+=`<article class="entry"><div><div class="year">${esc(x.year)}</div><svg viewBox="0 0 120 120">${x.svg}</svg></div><div><h3>${esc(x.title)}</h3><div>${esc(x.text)}</div><div class="term">${esc(x.term)}</div></div></article>`});
 main.insertAdjacentHTML('beforeend',h+'</section>');
});
document.querySelectorAll('svg path').forEach((p,i)=>{try{p.style.setProperty('--l',Math.ceil(p.getTotalLength())+1)}catch(e){p.style.setProperty('--l',400)}});
document.querySelectorAll('.entry svg').forEach(s=>s.querySelectorAll('path').forEach((p,i)=>p.style.setProperty('--i',i)));
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.2});
document.querySelectorAll('.entry').forEach(e=>{io.observe(e);e.addEventListener('click',()=>{e.classList.remove('in');void e.offsetWidth;e.classList.add('in')})});
